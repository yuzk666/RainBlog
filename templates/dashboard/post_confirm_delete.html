{% extends "base.html" %}

{% block title %}删除文章 · Rainzk{% endblock %}

{% block content %}
<section class="confirm-page">
    <p class="eyebrow">危险操作</p>
    <h1>确认删除文章？</h1>
    <p>你将删除《{{ post.title }}》以及它的全部评论。此操作无法撤销，上传的封面文件不会自动删除。</p>
    <form method="post" class="button-group">
        {% csrf_token %}
        <button class="button button-danger" type="submit">确认删除</button>
        <a class="button" href="{% url 'blog:dashboard' %}">取消</a>
    </form>
</section>
{% endblock %}
