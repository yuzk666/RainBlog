{% extends "base.html" %}

{% block title %}删除评论 · Rainzk{% endblock %}
{% block robots_meta %}<meta name="robots" content="noindex,nofollow">{% endblock %}

{% block content %}
<section class="confirm-page">
    <p class="eyebrow">危险操作</p>
    <h1>确认删除评论？</h1>
    <blockquote>{{ comment.content|truncatechars:180 }}</blockquote>
    <p>来自 {{ comment.name }}，文章《{{ comment.post.title }}》。此操作无法撤销。</p>
    <form method="post" class="button-group">
        {% csrf_token %}
        <button class="button button-danger" type="submit">确认删除</button>
        <a class="button" href="{% url 'blog:comment_moderation' %}">取消</a>
    </form>
</section>
{% endblock %}
