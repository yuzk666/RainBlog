{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="分页">
    {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}" rel="prev">上一页</a>
    {% else %}
        <span></span>
    {% endif %}
    <span>第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页</span>
    {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}" rel="next">下一页</a>
    {% else %}
        <span></span>
    {% endif %}
</nav>
{% endif %}
