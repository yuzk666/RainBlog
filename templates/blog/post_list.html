{% extends "base.html" %}

{% block title %}文章 · Rainzk{% endblock %}

{% block content %}
<header class="page-heading">
    <h1>文章</h1>
    <p>日记、随笔，以及一些未必成熟的想法。</p>
</header>
<div class="post-list">
    {% for post in page_obj %}
        {% include "blog/includes/post_item.html" %}
    {% empty %}
        <p class="empty-state">暂时还没有文章。</p>
    {% endfor %}
</div>
{% include "blog/includes/pagination.html" %}
{% endblock %}
